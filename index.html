<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的空间</title>
<style>
:root {
  --bg-mint: #D8F3DC;
  --bg-mint-deep: #B7E4C7;
  --bg-mint-soft: #EAF6EC;
  --teal: #52B788;
  --teal-light: #74C69D;
  --teal-pale: #B7E4C7;
  --teal-dark: #40916C;
  --lake: #2D6A73;
  --lake-light: #4A8E97;
  --lake-pale: #A3CED5;
  --warm-white: #FFFDF8;
  --warm-cream: #FAF5EE;
  --warm-apricot: #F3EDE4;
  --ink: #1B3A35;
  --ink-soft: #3A5E56;
  --ink-muted: #7FA39A;
  --card-bg: #FEFFFE;
  --divider: rgba(82,183,136,0.15);
  --glass: rgba(255,254,254,0.72);
  --glass-strong: rgba(255,254,254,0.88);
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --shadow-soft: 0 2px 20px rgba(27,58,53,0.06);
  --shadow-hover: 0 8px 32px rgba(27,58,53,0.10);
  --transition: 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--teal-pale) transparent;}
#gallery,#journal{scroll-margin-top:80px;}
body{font-family:'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif;background:var(--bg-mint-soft);color:var(--ink);line-height:1.8;overflow-x:hidden;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--teal-pale);border-radius:3px;}

/* ===== 导航 ===== */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 48px;height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(234,246,236,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--divider);transition:var(--transition);}
.nav.scrolled{box-shadow:var(--shadow-soft);}
.nav-brand{font-size:18px;font-weight:600;color:var(--lake);letter-spacing:2px;cursor:default;}
.nav-links{display:flex;gap:36px;}
.nav-links a{font-size:14px;color:var(--ink-soft);text-decoration:none;letter-spacing:1px;position:relative;transition:var(--transition);cursor:pointer;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:var(--teal);transition:var(--transition);}
.nav-links a:hover{color:var(--teal);}
.nav-links a:hover::after{width:100%;}

/* ===== 英雄区 ===== */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--bg-mint) 0%,var(--bg-mint-soft) 40%,var(--warm-apricot) 100%);}
.hero::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;top:-100px;right:-150px;background:radial-gradient(circle,var(--lake-pale) 0%,transparent 70%);opacity:0.5;animation:float 8s ease-in-out infinite;}
.hero::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;bottom:-50px;left:-100px;background:radial-gradient(circle,var(--teal-pale) 0%,transparent 70%);opacity:0.5;animation:float 10s ease-in-out infinite reverse;}
@keyframes float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(30px,-20px) scale(1.05);}}
.hero-content{text-align:center;position:relative;z-index:1;padding:0 24px;}
.hero-eyebrow{font-size:13px;letter-spacing:6px;color:var(--teal);text-transform:uppercase;margin-bottom:24px;}
.hero-title{font-size:clamp(40px,7vw,80px);font-weight:300;line-height:1.2;margin-bottom:16px;background:linear-gradient(135deg,var(--lake) 0%,var(--teal) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-sub{font-size:18px;color:var(--ink-muted);max-width:480px;margin:0 auto 48px;font-weight:300;}
.hero-cta{display:inline-flex;align-items:center;gap:10px;padding:14px 36px;border:none;border-radius:50px;background:var(--teal);color:#fff;font-size:15px;letter-spacing:1px;cursor:pointer;transition:var(--transition);font-family:inherit;}
.hero-cta:hover{background:var(--lake);transform:translateY(-2px);box-shadow:var(--shadow-hover);}
.hero-cta svg{width:18px;height:18px;}

/* ===== 通用 ===== */
.section{padding:100px 48px;max-width:1280px;margin:0 auto;}
.section-label{font-size:12px;letter-spacing:4px;color:var(--teal);text-transform:uppercase;margin-bottom:12px;}
.section-title{font-size:32px;font-weight:400;margin-bottom:24px;color:var(--ink);}
.section-title em{font-style:normal;color:var(--lake);}

/* ===== 工具栏（搜索+筛选） ===== */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:36px;}
.search-box{position:relative;flex:1;min-width:200px;max-width:360px;}
.search-box input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--teal-pale);border-radius:50px;background:var(--glass);color:var(--ink);font-size:14px;font-family:inherit;outline:none;transition:var(--transition);}
.search-box input::placeholder{color:var(--ink-muted);}
.search-box input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(82,183,136,0.12);}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-muted);}
.filter-tags{display:flex;gap:8px;flex-wrap:wrap;}
.filter-tag{padding:6px 16px;border:1px solid var(--teal-pale);border-radius:50px;font-size:13px;color:var(--ink-muted);cursor:pointer;font-family:inherit;background:transparent;transition:var(--transition);}
.filter-tag:hover{border-color:var(--teal);color:var(--teal);}
.filter-tag.active{background:var(--teal);color:#fff;border-color:var(--teal);}

/* ===== 画廊 ===== */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
.gallery-item{position:relative;border-radius:var(--radius-md);overflow:hidden;cursor:pointer;transition:var(--transition);min-height:220px;}
.gallery-item:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);}
/* 虚化背景层 */
.gallery-item .blur-bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(24px) saturate(1.2);transform:scale(1.15);transition:filter 0.6s ease;}
.gallery-item:hover .blur-bg{filter:blur(28px) saturate(1.4) brightness(1.05);}
/* 主图 */
.gallery-item .main-media{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.gallery-item .main-media img,.gallery-item .main-media video{max-width:100%;max-height:100%;object-fit:contain;display:block;}
/* 玻璃信息条 */
.gallery-item .info-bar{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:16px 18px;background:var(--glass);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,0.3);transform:translateY(100%);transition:var(--transition);}
.gallery-item:hover .info-bar{transform:translateY(0);}
.info-bar .caption{font-size:14px;color:var(--ink);font-weight:500;}
.info-bar .date{font-size:11px;color:var(--ink-muted);margin-top:2px;}
/* 竖幅/宽幅 */
.gallery-item.portrait{grid-row:span 2;min-height:460px;}
.gallery-item.wide{grid-column:span 2;}

/* ===== 日记 ===== */
.journal-list{display:flex;flex-direction:column;gap:0;}
.journal-entry{position:relative;padding:36px 48px 36px 36px;border-left:2px solid var(--teal-light);margin-left:24px;transition:var(--transition);overflow:hidden;}
.journal-entry::before{content:'';position:absolute;left:-7px;top:40px;width:12px;height:12px;border-radius:50%;background:var(--lake);border:2px solid var(--bg-mint-soft);z-index:2;}
.journal-entry:hover{background:var(--card-bg);border-radius:0 var(--radius-md) var(--radius-md) 0;}
/* 日记虚化背景 */
.journal-entry .j-blur-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(40px) saturate(1.1) brightness(1.08);opacity:0;transition:opacity 0.6s ease;z-index:0;}
.journal-entry:hover .j-blur-bg{opacity:0.25;}
.journal-entry>*:not(.j-blur-bg){position:relative;z-index:1;}
.journal-date{font-size:12px;letter-spacing:2px;color:var(--teal);margin-bottom:8px;}
.journal-title{font-size:22px;font-weight:400;margin-bottom:12px;color:var(--ink);}
.journal-body{font-size:15px;color:var(--ink-soft);line-height:2;max-width:680px;}
.journal-images{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;}
.journal-images img{height:120px;border-radius:var(--radius-sm);object-fit:cover;transition:var(--transition);cursor:pointer;}
.journal-images img:hover{transform:scale(1.03);}
.journal-actions{position:absolute;top:36px;right:16px;display:flex;gap:8px;opacity:0;transition:var(--transition);z-index:3;}
.journal-entry:hover .journal-actions{opacity:1;}
.journal-actions button{background:none;border:1px solid var(--teal-light);border-radius:20px;padding:4px 14px;font-size:12px;color:var(--ink-muted);cursor:pointer;font-family:inherit;transition:var(--transition);}
.journal-actions button:hover{background:var(--lake);color:#fff;border-color:var(--lake);}

/* 新建日记 */
.journal-new{border:2px dashed var(--teal-pale);border-radius:var(--radius-lg);padding:40px;background:var(--card-bg);margin-top:40px;}
.journal-new-title{font-size:20px;border:none;outline:none;background:transparent;color:var(--ink);width:100%;font-family:inherit;margin-bottom:16px;}
.journal-new-title::placeholder{color:var(--ink-muted);}
.journal-new-body{font-size:15px;border:none;outline:none;background:transparent;color:var(--ink-soft);width:100%;min-height:120px;resize:vertical;font-family:inherit;line-height:2;}
.journal-new-body::placeholder{color:var(--ink-muted);}
.journal-new-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--divider);}
.journal-new-footer .attach-btns{display:flex;gap:12px;}
.attach-btn{background:none;border:1px solid var(--teal-light);border-radius:20px;padding:6px 16px;font-size:13px;color:var(--ink-muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:var(--transition);}
.attach-btn:hover{background:var(--bg-mint);border-color:var(--teal);}
.attach-btn svg{width:16px;height:16px;}
.save-btn{background:var(--teal);border:none;border-radius:50px;padding:10px 28px;color:#fff;font-size:14px;cursor:pointer;font-family:inherit;letter-spacing:1px;transition:var(--transition);}
.save-btn:hover{background:var(--lake);}
.preview-images{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.preview-thumb{position:relative;width:80px;height:80px;border-radius:var(--radius-sm);overflow:hidden;}
.preview-thumb img{width:100%;height:100%;object-fit:cover;}
.preview-thumb .remove-img{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* ===== FAB浮动上传按钮 ===== */
.fab-group{position:fixed;bottom:32px;right:32px;z-index:90;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.fab-main{width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(82,183,136,0.35);transition:var(--transition);display:flex;align-items:center;justify-content:center;}
.fab-main:hover{background:var(--lake);transform:scale(1.08);}
.fab-main.open{transform:rotate(45deg);}
.fab-sub{display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(10px);pointer-events:none;transition:var(--transition);}
.fab-group.open .fab-sub{opacity:1;transform:translateY(0);pointer-events:auto;}
.fab-sub button{height:42px;padding:0 20px;border:none;border-radius:50px;background:var(--glass-strong);backdrop-filter:blur(16px);color:var(--ink-soft);font-size:13px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-soft);display:flex;align-items:center;gap:6px;transition:var(--transition);white-space:nowrap;}
.fab-sub button:hover{background:var(--teal);color:#fff;}
.fab-sub button svg{width:16px;height:16px;}

/* ===== 灯箱 ===== */
.lightbox{display:none;position:fixed;inset:0;z-index:200;background:rgba(27,58,53,0.92);align-items:center;justify-content:center;backdrop-filter:blur(10px);}
.lightbox.active{display:flex;}
.lightbox img,.lightbox video{max-width:90vw;max-height:85vh;border-radius:var(--radius-md);object-fit:contain;}
.lightbox-close{position:absolute;top:24px;right:32px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer;opacity:0.7;transition:var(--transition);}
.lightbox-close:hover{opacity:1;}

/* ===== 空状态 ===== */
.empty-state{text-align:center;padding:60px 24px;color:var(--ink-muted);}
.empty-state svg{width:64px;height:64px;color:var(--teal-pale);margin-bottom:16px;}
.empty-state p{font-size:15px;}

/* ===== Toast ===== */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--lake);color:#fff;padding:12px 28px;border-radius:50px;font-size:14px;z-index:300;opacity:0;transition:0.4s ease;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== 动画 ===== */
.fade-up{opacity:0;transform:translateY(30px);transition:opacity 0.6s ease,transform 0.6s ease;}
.fade-up.visible{opacity:1;transform:translateY(0);}

/* ===== 响应式 ===== */
@media(max-width:768px){
  .nav{padding:0 20px;}
  .section{padding:60px 20px;}
  .gallery-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  .gallery-item.wide{grid-column:span 1;}
  .journal-entry{padding:24px 20px;margin-left:16px;}
  .journal-new{padding:24px;}
  .fab-group{bottom:20px;right:20px;}
}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-brand">我的空间</div>
  <div class="nav-links">
    <a href="#gallery" onclick="event.preventDefault();document.getElementById('gallery').scrollIntoView({behavior:'smooth'})">画廊</a>
    <a href="#journal" onclick="event.preventDefault();document.getElementById('journal').scrollIntoView({behavior:'smooth'})">随笔</a>
  </div>
</nav>

<section class="hero">
  <div class="hero-content fade-up">
    <div class="hero-eyebrow">Personal Space</div>
    <h1 class="hero-title">记录，<br>以自己的方式</h1>
    <p class="hero-sub">影像与文字交织的私人领地，每一帧都是生活的注脚</p>
    <button class="hero-cta" onclick="document.getElementById('gallery').scrollIntoView({behavior:'smooth'})">
      开始探索
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>
</section>

<!-- 画廊 -->
<section class="section" id="gallery">
  <div class="section-label fade-up">Gallery</div>
  <h2 class="section-title fade-up">光影<em>拾遗</em></h2>

  <div class="toolbar fade-up">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="gallerySearch" placeholder="搜索影像…" oninput="filterGallery()">
    </div>
    <div class="filter-tags">
      <button class="filter-tag active" data-filter="all" onclick="setGalleryFilter('all',this)">全部</button>
      <button class="filter-tag" data-filter="image" onclick="setGalleryFilter('image',this)">照片</button>
      <button class="filter-tag" data-filter="video" onclick="setGalleryFilter('video',this)">视频</button>
    </div>
  </div>

  <div class="gallery-grid fade-up" id="galleryGrid"></div>
  <div class="empty-state" id="galleryEmpty" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    <p>还没有影像，点击右下角 + 开始添加</p>
  </div>
</section>

<!-- 随笔 -->
<section class="section" id="journal">
  <div class="section-label fade-up">Journal</div>
  <h2 class="section-title fade-up">文字<em>留痕</em></h2>

  <div class="toolbar fade-up">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="journalSearch" placeholder="搜索随笔…" oninput="filterJournals()">
    </div>
    <div class="filter-tags">
      <button class="filter-tag active" data-filter="all" onclick="setJournalFilter('all',this)">全部</button>
      <button class="filter-tag" data-filter="with-images" onclick="setJournalFilter('with-images',this)">图文</button>
      <button class="filter-tag" data-filter="text-only" onclick="setJournalFilter('text-only',this)">纯文</button>
    </div>
  </div>

  <div class="journal-list fade-up" id="journalList"></div>
  <div class="empty-state" id="journalEmpty" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <p>还没有随笔，点击右下角 + 开始记录</p>
  </div>

  <div class="journal-new fade-up" id="journalNew" style="display:none;">
    <input class="journal-new-title" id="jTitle" placeholder="给这篇随笔起个名字…" />
    <textarea class="journal-new-body" id="jBody" placeholder="写下此刻的想法…"></textarea>
    <div class="preview-images" id="jPreviewImages"></div>
    <div class="journal-new-footer">
      <div class="attach-btns">
        <button class="attach-btn" onclick="document.getElementById('jImageInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          图片
        </button>
        <input type="file" id="jImageInput" accept="image/*" multiple style="display:none">
      </div>
      <button class="save-btn" onclick="saveJournal()">保存</button>
    </div>
  </div>
</section>

<!-- FAB 浮动上传 -->
<div class="fab-group" id="fabGroup">
  <div class="fab-sub">
    <button onclick="document.getElementById('mediaInput').click();closeFab()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      添加影像
    </button>
  </div>
  <div class="fab-sub">
    <button onclick="toggleJournalNew();closeFab()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      写随笔
    </button>
  </div>
  <button class="fab-main" id="fabMain" onclick="toggleFab()">+</button>
</div>
<input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none">

<!-- 灯箱 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close">&times;</button>
  <div id="lightboxContent"></div>
</div>

<div class="toast" id="toast"></div>

<footer class="footer">用 <span>♥</span> 与像素构筑 · 我的空间</footer>

<script>
const STORAGE_KEY = 'personal_space_data';
function loadData(){try{const r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):{gallery:[],journals:[]};}catch{return{gallery:[],journals:[]};}}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}
let appData = loadData();

// ===== 筛选状态 =====
let galleryFilter = 'all';
let journalFilter = 'all';

// ===== FAB =====
function toggleFab(){
  document.getElementById('fabGroup').classList.toggle('open');
  document.getElementById('fabMain').classList.toggle('open');
}
function closeFab(){
  document.getElementById('fabGroup').classList.remove('open');
  document.getElementById('fabMain').classList.remove('open');
}
function toggleJournalNew(){
  const el = document.getElementById('journalNew');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  if(el.style.display === 'block') el.scrollIntoView({behavior:'smooth',block:'center'});
}

// ===== 画廊 =====
function getFilteredGallery(){
  const q = document.getElementById('gallerySearch').value.trim().toLowerCase();
  return appData.gallery.filter(item => {
    if(galleryFilter !== 'all' && item.type !== galleryFilter) return false;
    if(q && !(item.caption||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderGallery(){
  const grid = document.getElementById('galleryGrid');
  const empty = document.getElementById('galleryEmpty');
  const items = getFilteredGallery();
  grid.innerHTML = '';

  if(items.length === 0){
    empty.style.display = 'block';
    if(appData.gallery.length === 0) empty.querySelector('p').textContent = '还没有影像，点击右下角 + 开始添加';
    else empty.querySelector('p').textContent = '没有匹配的影像';
    return;
  }
  empty.style.display = 'none';

  const sizes = ['','portrait','wide'];
  items.forEach((item, i) => {
    const div = document.createElement('div');
    const sizeClass = item.size || sizes[i % 3];
    div.className = `gallery-item ${sizeClass}`;

    const bgStyle = `background-image:url('${item.poster || item.src}')`;

    if(item.type === 'video'){
      div.innerHTML = `
        <div class="blur-bg" style="${bgStyle}"></div>
        <div class="main-media">
          <video src="${item.src}" muted loop preload="metadata" onmouseenter="this.play()" onmouseleave="this.pause()" onclick="openLightbox('${item.src}','video')"></video>
        </div>
        <div class="info-bar">
          <div class="caption">${item.caption || ''}</div>
          <div class="date">${item.date || ''}</div>
        </div>`;
    } else {
      div.innerHTML = `
        <div class="blur-bg" style="${bgStyle}"></div>
        <div class="main-media">
          <img src="${item.src}" alt="${item.caption || ''}" onclick="openLightbox('${item.src}','image')" loading="lazy"/>
        </div>
        <div class="info-bar">
          <div class="caption">${item.caption || ''}</div>
          <div class="date">${item.date || ''}</div>
        </div>`;
    }
    grid.appendChild(div);
  });
}

function setGalleryFilter(f, el){
  galleryFilter = f;
  document.querySelectorAll('#gallery .filter-tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderGallery();
}
function filterGallery(){ renderGallery(); }

document.getElementById('mediaInput').addEventListener('change', function(e){
  const files = Array.from(e.target.files);
  const sizes = ['','portrait','wide'];
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev){
      const isVideo = file.type.startsWith('video');
      const entry = {
        type: isVideo ? 'video' : 'image',
        src: ev.target.result,
        caption: file.name.replace(/\.[^.]+$/, ''),
        date: new Date().toLocaleDateString('zh-CN'),
        size: sizes[appData.gallery.length % 3]
      };
      // 视频提取首帧作为虚化背景
      if(isVideo){
        const vid = document.createElement('video');
        vid.src = ev.target.result;
        vid.muted = true;
        vid.onloadeddata = function(){
          vid.currentTime = 0.5;
        };
        vid.onseeked = function(){
          try{
            const c = document.createElement('canvas');
            c.width = 160; c.height = 90;
            c.getContext('2d').drawImage(vid,0,0,160,90);
            entry.poster = c.toDataURL('image/jpeg',0.5);
          }catch(e){}
          appData.gallery.push(entry);
          saveData(appData);
          renderGallery();
          vid.remove();
        };
      } else {
        appData.gallery.push(entry);
        saveData(appData);
        renderGallery();
      }
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
  showToast('影像已添加');
});

// ===== 日记 =====
let journalImages = [];

function getFilteredJournals(){
  const q = document.getElementById('journalSearch').value.trim().toLowerCase();
  return appData.journals.slice().reverse().filter(entry => {
    if(journalFilter === 'with-images' && (!entry.images || !entry.images.length)) return false;
    if(journalFilter === 'text-only' && entry.images && entry.images.length) return false;
    if(q && !(entry.title||'').toLowerCase().includes(q) && !(entry.body||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderJournals(){
  const list = document.getElementById('journalList');
  const empty = document.getElementById('journalEmpty');
  const items = getFilteredJournals();
  list.innerHTML = '';

  if(items.length === 0){
    empty.style.display = 'block';
    if(appData.journals.length === 0) empty.querySelector('p').textContent = '还没有随笔，点击右下角 + 开始记录';
    else empty.querySelector('p').textContent = '没有匹配的随笔';
    return;
  }
  empty.style.display = 'none';

  items.forEach((entry, i) => {
    const realIndex = appData.journals.length - 1 - i;
    const div = document.createElement('div');
    div.className = 'journal-entry';

    // 用第一张图做虚化背景
    let blurBg = '';
    if(entry.images && entry.images.length){
      blurBg = `<div class="j-blur-bg" style="background-image:url('${entry.images[0]}');background-size:cover;background-position:center;"></div>`;
    }

    let imagesHtml = '';
    if(entry.images && entry.images.length){
      imagesHtml = '<div class="journal-images">' +
        entry.images.map(img => `<img src="${img}" onclick="openLightbox('${img}','image')" loading="lazy"/>`).join('') + '</div>';
    }

    div.innerHTML = `
      ${blurBg}
      <div class="journal-date">${entry.date}</div>
      <div class="journal-title">${entry.title}</div>
      <div class="journal-body">${entry.body.replace(/\n/g,'<br>')}</div>
      ${imagesHtml}
      <div class="journal-actions">
        <button onclick="deleteJournal(${realIndex})">删除</button>
      </div>`;
    list.appendChild(div);
  });
}

function setJournalFilter(f, el){
  journalFilter = f;
  document.querySelectorAll('#journal .filter-tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderJournals();
}
function filterJournals(){ renderJournals(); }

function saveJournal(){
  const title = document.getElementById('jTitle').value.trim();
  const body = document.getElementById('jBody').value.trim();
  if(!title && !body){showToast('写点什么再保存吧');return;}
  appData.journals.push({
    title: title || '无题',
    body: body,
    date: new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}),
    images:[...journalImages]
  });
  saveData(appData);
  document.getElementById('jTitle').value='';
  document.getElementById('jBody').value='';
  journalImages=[];
  document.getElementById('jPreviewImages').innerHTML='';
  document.getElementById('journalNew').style.display='none';
  renderJournals();
  showToast('随笔已保存');
}

function deleteJournal(index){
  appData.journals.splice(index,1);
  saveData(appData);
  renderJournals();
  showToast('已删除');
}

document.getElementById('jImageInput').addEventListener('change',function(e){
  Array.from(e.target.files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=function(ev){
      journalImages.push(ev.target.result);
      renderJournalPreviews();
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
});

function renderJournalPreviews(){
  const c=document.getElementById('jPreviewImages');
  c.innerHTML=journalImages.map((img,i)=>`
    <div class="preview-thumb">
      <img src="${img}"/>
      <button class="remove-img" onclick="removeJournalImage(${i})">&times;</button>
    </div>
  `).join('');
}
function removeJournalImage(i){journalImages.splice(i,1);renderJournalPreviews();}

// ===== 灯箱 =====
function openLightbox(src,type){
  const lb=document.getElementById('lightbox');
  const ct=document.getElementById('lightboxContent');
  if(type==='video'){
    ct.innerHTML=`<video src="${src}" controls autoplay style="max-width:90vw;max-height:85vh;border-radius:16px;"></video>`;
  }else{
    ct.innerHTML=`<img src="${src}"/>`;
  }
  lb.classList.add('active');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow='';
  document.getElementById('lightboxContent').innerHTML='';
}

// ===== Toast =====
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ===== 滚动 =====
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');});
},{threshold:0.1});
document.querySelectorAll('.fade-up').forEach(el=>observer.observe(el));

window.addEventListener('scroll',()=>{
  document.getElementById('nav').classList.toggle('scrolled',window.scrollY>20);
});

// 点击空白关闭FAB
document.addEventListener('click',function(e){
  if(!e.target.closest('.fab-group')) closeFab();
});

// ===== 初始化 =====
renderGallery();
renderJournals();
</script>
</body>
</html>
